<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLJobWatch — Discover ML &amp; AI Jobs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>
<body>

  <!-- Hero Section: Text Left, Robot Right -->
  <section class="hero-section">
    <div class="hero-text">
      <h1>MLJobWatch</h1>
      <p>Track the latest machine learning and AI job opportunities across the industry.</p>
      <div class="cta-wrapper">
        <a href="pages/jobs.html" class="btn-go-jobs" aria-label="Go to jobs">
          Go to Jobs
          <span class="btn-arrow">→</span>
        </a>
      </div>
    </div>

    <div class="hero-robot">
      <div class="robot-container">
        <div class="robot-base"></div>
        <div class="robot-head">
          <div class="eyebrow left"></div>
          <div class="eyebrow right"></div>
          <div class="antenna left">
            <div class="antenna-tip"></div>
          </div>
          <div class="antenna right">
            <div class="antenna-tip"></div>
          </div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="cheek left"></div>
          <div class="cheek right"></div>
          <div class="smile"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Secondary Navigation -->
  <nav class="nav-links">
    <a href="pages/login.html" class="nav-link"><i class="fas fa-sign-in-alt"></i> Sign In</a>
    <a href="pages/about.html" class="nav-link"><i class="fas fa-info-circle"></i> About</a>
  </nav>

</body>
</html>
